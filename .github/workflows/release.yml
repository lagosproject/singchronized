name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: appimage,deb
            gpuAssetSuffix: linux-x64
          - platform: windows-latest
            bundles: nsis
            gpuAssetSuffix: windows-x64
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential libssl-dev libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Install backend dependencies (CPU torch)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch keeps the bundle a fraction of the CUDA build's size
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt pyinstaller

      - name: Build backend sidecar with PyInstaller
        shell: bash
        run: pyinstaller singchronized-backend.spec --noconfirm

      - name: Stage backend into Tauri resources
        shell: bash
        run: |
          mkdir -p frontend/src-tauri/resources
          cp -r dist/singchronized-backend frontend/src-tauri/resources/backend

      - name: Help linuxdeploy resolve PyInstaller libs (AppImage)
        if: matrix.platform == 'ubuntu-22.04'
        # linuxdeploy ignores rpath/$ORIGIN, so wheel-mangled libs inside the
        # frozen backend (e.g. libdrm-<hash>.so from av/torchcodec) appear
        # unresolvable. Point LD_LIBRARY_PATH at the lib dirs as they will be
        # staged inside the AppDir; libs found there are treated as already
        # deployed instead of being copied again.
        run: |
          appdir="$GITHUB_WORKSPACE/frontend/src-tauri/target/release/bundle/appimage/SingChronized.AppDir/usr/lib/SingChronized/backend"
          libpath=$(find dist/singchronized-backend/_internal -name '*.so*' -printf '%h\n' | sort -u \
            | sed "s|^dist/singchronized-backend|$appdir|" | paste -sd:)
          echo "LD_LIBRARY_PATH=$libpath" >> "$GITHUB_ENV"
          echo "NO_STRIP=true" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build and bundle Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          # On tag pushes, upload bundles to a draft GitHub release
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('SingChronized {0}', github.ref_name) || '' }}
          releaseDraft: true
          args: --bundles ${{ matrix.bundles }}

      - name: Upload artifacts (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: singchronized-${{ matrix.platform }}
          path: |
            frontend/src-tauri/target/release/bundle/deb/*.deb
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
            frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Build GPU pack (CUDA torch backend, no installer)
        shell: bash
        run: |
          python -m venv .gpu-venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            GPU_PY=".gpu-venv/Scripts/python.exe"
          else
            GPU_PY=".gpu-venv/bin/python"
          fi
          "$GPU_PY" -m pip install --upgrade pip
          # CUDA-enabled torch: this build is never bundled into the installer,
          # only zipped and attached to the release as an optional download
          # (see backend/app/services/gpu_pack.py), so its size doesn't hit
          # the NSIS/WiX ~2GB packaging limit that a CUDA-in-installer build does.
          "$GPU_PY" -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cu128
          "$GPU_PY" -m pip install -r backend/requirements.txt pyinstaller
          "$GPU_PY" -m PyInstaller singchronized-backend.spec --noconfirm --distpath dist-gpu --workpath build-gpu

      - name: Package GPU pack asset
        shell: bash
        run: |
          asset="singchronized-backend-gpu-${{ matrix.gpuAssetSuffix }}.zip"
          cd dist-gpu
          python -m zipfile -c "../$asset" singchronized-backend
          cd ..
          python3 - "$asset" > "$asset.sha256" <<'PYEOF'
          import hashlib, sys
          h = hashlib.sha256()
          with open(sys.argv[1], 'rb') as f:
              for chunk in iter(lambda: f.read(1 << 20), b''):
                  h.update(chunk)
          print(f'{h.hexdigest()}  {sys.argv[1]}')
          PYEOF

      - name: Upload GPU pack (tag pushes)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${{ github.ref_name }}" \
            "singchronized-backend-gpu-${{ matrix.gpuAssetSuffix }}.zip" \
            "singchronized-backend-gpu-${{ matrix.gpuAssetSuffix }}.zip.sha256" \
            --clobber

      - name: Upload GPU pack (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: singchronized-gpu-pack-${{ matrix.gpuAssetSuffix }}
          path: |
            singchronized-backend-gpu-${{ matrix.gpuAssetSuffix }}.zip
            singchronized-backend-gpu-${{ matrix.gpuAssetSuffix }}.zip.sha256
          if-no-files-found: error
